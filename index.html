<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EVクイズ ○×ボディ判定</title>
<style>
  :root{
    --bg:#eef3f9; --glass:rgba(255,255,255,.74); --glass2:rgba(20,40,70,.05);
    --line:rgba(20,40,70,.14); --fg:#14202e; --sub:#546478; --dim:#8794a6;
    --ok:#12a56b; --ng:#e0405a; --acc:#1e8fe0; --lv:var(--acc);
    --font:"Segoe UI",-apple-system,BlinkMacSystemFont,"Yu Gothic UI","Hiragino Sans","Meiryo",sans-serif;
  }
  body[data-lv=easy]{--lv:#12a56b} body[data-lv=normal]{--lv:#d28a00}
  body[data-lv=hard]{--lv:#e5533d} body[data-lv=expert]{--lv:#8a52e0}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);
    overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased}
  canvas#view{position:fixed;inset:0;width:100%;height:100%}
  #vig{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%,rgba(238,243,249,.38) 30%,rgba(238,243,249,.86) 100%),linear-gradient(rgba(238,243,249,.7),rgba(238,243,249,.1) 30%,rgba(238,243,249,.1) 70%,rgba(238,243,249,.75))}
  .glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 10px 40px rgba(30,60,100,.14),inset 0 1px 0 rgba(255,255,255,.9)}
  .eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--sub);font-weight:600}

  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:18px 28px;z-index:10}
  #hud .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.16em;font-size:14px}
  #hud .brand i{width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc)}
  #hudLv{padding:6px 16px;border-radius:99px;font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--lv);border:1px solid var(--lv);background:rgba(255,255,255,.7)}
  #hud .right{display:flex;align-items:center;gap:16px}
  #hudR{font-size:14px;color:var(--sub);letter-spacing:.08em;font-variant-numeric:tabular-nums;text-align:right}
  #hudR b{color:var(--fg);font-size:22px;margin-left:6px}
  #ttsBtn{font:inherit;font-size:12px;letter-spacing:.1em;color:var(--fg);background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer}
  #ttsBtn.off{color:var(--dim)}
  #ttsBtn:hover{border-color:var(--acc)}
  #timer{position:fixed;top:0;left:0;right:0;height:4px;z-index:7;display:none;background:rgba(20,40,70,.1)}
  #timer i{display:block;height:100%;width:100%;background:var(--lv);box-shadow:0 0 14px var(--lv);transition:background .3s}

  .screen{position:fixed;inset:0;display:none;z-index:3;flex-direction:column;align-items:center;justify-content:center;padding:70px 5vw 40px;text-align:center;overflow-y:auto;overflow-x:hidden}
  .screen.on{display:flex;animation:rise .5s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  h1{font-size:clamp(40px,7vw,92px);margin:10px 0 6px;font-weight:200;letter-spacing:.06em;line-height:1.05}
  h1 b{font-weight:800;background:linear-gradient(90deg,#1a7fd6,#2fa0ee 50%,#6a5cf0);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lead{font-size:clamp(15px,1.7vw,21px);color:var(--sub);margin:0 0 38px;line-height:1.8}
  .lead b{color:var(--fg);font-weight:600}
  .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;width:min(1180px,94vw)}
  @media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.hint{display:none}}
  .btns{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}

  .btn{position:relative;overflow:hidden;color:var(--fg);cursor:pointer;font:inherit;text-align:left;--p:0;--c:var(--acc);
    background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:26px 24px 22px;
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 40px rgba(30,60,100,.14);
    transition:transform .2s,border-color .2s,box-shadow .2s}
  .btn:hover{transform:translateY(-4px);border-color:var(--c);box-shadow:0 14px 44px rgba(30,60,100,.2),0 0 0 1px var(--c)}
  .btn::after{content:"";position:absolute;left:0;bottom:0;height:5px;width:calc(var(--p)*100%);background:var(--c);box-shadow:0 0 14px var(--c);pointer-events:none}
  .btn::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 22%,transparent),transparent 55%);opacity:calc(.35 + var(--p));pointer-events:none}
  .btn > *{position:relative}
  .btn .no{font-size:13px;letter-spacing:.24em;color:var(--c);font-weight:700}
  .btn b{display:block;font-size:clamp(22px,2.4vw,32px);margin:14px 0 6px;font-weight:700;letter-spacing:.04em}
  .btn small{display:block;font-size:clamp(13px,1.2vw,15px);color:var(--sub);line-height:1.6;min-height:3.2em}
  .btn .dots{margin-top:14px;display:flex;gap:6px}
  .btn .dots i{width:22px;height:5px;border-radius:3px;background:rgba(20,40,70,.14)}
  .btn .dots i.on{background:var(--c);box-shadow:0 0 8px var(--c)}
  .btn.easy{--c:#12a56b}.btn.normal{--c:#d28a00}.btn.hard{--c:#e5533d}.btn.expert{--c:#8a52e0}
  .btn.plain{text-align:center;padding:16px 34px;border-radius:99px;min-width:220px}
  .btn.plain b{margin:0;font-size:clamp(17px,1.8vw,22px)}
  .btn.plain::before{opacity:calc(var(--p)*.8)}
  #unlock{display:none;margin-top:22px;padding:10px 22px;border-radius:99px;font-size:14px;color:var(--fg);border:1px solid var(--acc);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 6px rgba(30,143,224,.15)}}
  .tip{margin-top:30px;font-size:13px;color:var(--dim);letter-spacing:.1em}

  #qpanel{position:fixed;left:50%;top:74px;transform:translateX(-50%);width:min(94vw,1040px);z-index:4;display:none;
    border-radius:24px;padding:22px 34px 24px;text-align:left;border-left:4px solid var(--lv)}
  #qpanel .row{display:flex;justify-content:space-between;align-items:center;gap:20px}
  #qNo{color:var(--lv)}
  #segs{display:flex;gap:5px}
  #segs i{width:26px;height:5px;border-radius:3px;background:rgba(20,40,70,.14)}
  #segs i.ok{background:var(--ok)} #segs i.ng{background:var(--ng)} #segs i.cur{background:var(--lv);box-shadow:0 0 8px var(--lv)}
  #qpanel .q{font-size:clamp(22px,3vw,40px);font-weight:600;line-height:1.5;margin-top:12px;letter-spacing:.02em}
  #guide{position:fixed;left:0;right:0;bottom:26px;display:none;justify-content:center;gap:18px;z-index:4;flex-wrap:wrap;padding:0 16px}
  #guide div{display:flex;align-items:center;gap:14px;border-radius:99px;padding:10px 24px 10px 12px;font-size:clamp(13px,1.4vw,17px);color:var(--sub)}
  #guide em{font-style:normal;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:800;border:2px solid}
  #guide .o em{color:var(--ok);border-color:var(--ok)} #guide .x em{color:var(--ng);border-color:var(--ng)}
  #ring{position:fixed;left:50%;top:56%;width:180px;height:180px;margin:-90px 0 0 -90px;z-index:5;display:none;pointer-events:none}
  #ring .m{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:92px;font-weight:300}

  #reveal{position:fixed;inset:0;display:none;z-index:8;flex-direction:column;align-items:center;justify-content:center;
    overflow:auto;background:rgba(238,243,249,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-align:center;padding:5vw}
  #reveal.on{display:flex;animation:rise .35s ease both}
  #rvCard{margin:auto;width:min(92vw,820px);border-radius:28px;padding:34px 40px 30px}
  #rvMark{width:112px;height:112px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;font-size:66px;font-weight:300;border:3px solid;line-height:1}
  #reveal.ok #rvMark{color:var(--ok);border-color:var(--ok);box-shadow:0 0 40px rgba(62,224,160,.35)}
  #reveal.ng #rvMark{color:var(--ng);border-color:var(--ng);box-shadow:0 0 40px rgba(255,107,129,.35)}
  #rvMsg{font-size:clamp(26px,3.4vw,42px);font-weight:700;letter-spacing:.06em}
  #rvAns{font-size:clamp(14px,1.6vw,18px);color:var(--sub);margin:6px 0 18px;letter-spacing:.06em}
  #rvExp{font-size:clamp(16px,1.7vw,22px);line-height:1.75;text-align:left;padding:18px 22px;border-radius:16px;background:var(--glass2);border:1px solid var(--line)}
  #rvExp p{margin:0 0 .55em}
  #rvExp p:last-child{margin-bottom:0}
  #rvExp .lead{font-weight:700;color:var(--fg)}
  #rvNextWrap{margin-top:22px}

  #status{position:fixed;left:28px;bottom:96px;z-index:9;font-size:13px;color:var(--sub);padding:8px 14px;border-radius:12px;max-width:60vw}
  .hint{position:fixed;right:24px;bottom:14px;z-index:9;font-size:11px;letter-spacing:.06em;color:var(--dim);text-align:right}

  #score{font-size:clamp(90px,16vw,200px);font-weight:200;line-height:1;letter-spacing:-.02em;color:var(--lv);text-shadow:0 0 50px color-mix(in srgb,var(--lv) 40%,transparent)}
  #score small{font-size:.28em;color:var(--sub);letter-spacing:.04em;margin-left:.2em}
  .rank{font-size:clamp(22px,3vw,38px);font-weight:700;letter-spacing:.1em;margin:10px 0 6px}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="vig"></div>
<video id="cam" playsinline muted style="display:none"></video>

<div id="hud"><span class="brand"><i></i>EV QUIZ</span><span id="hudLv" style="display:none"></span><span class="right"><span id="hudR"></span><button id="ttsBtn" title="M キーでも切替"></button></span></div>
<div id="timer"><i></i></div>
<div id="status" class="glass">カメラとAIモデルを準備中…</div>
<div class="hint">KEYS　1-4 レベル / O ○ / X × / Space 次へ / R もう一度 / M 読み上げ / V 声の切替 / ESC 中断</div>

<section class="screen on" id="sLevel">
  <div class="eyebrow">Body-judge ○× quiz</div>
  <h1>EV<b>クイズ</b></h1>
  <p class="lead">体で <b>○</b> か <b>×</b> を答えよう。<br>レベルのカードに<b>手を1秒かざす</b>とスタートします。</p>
  <div class="cards">
    <button class="btn easy" data-lv="easy"><span class="no">LEVEL 01</span><b>やさしい</b><small>はじめてでもOK。<br>EVの基本のき</small><span class="dots"><i class="on"></i><i></i><i></i><i></i></span></button>
    <button class="btn normal" data-lv="normal"><span class="no">LEVEL 02</span><b>ふつう</b><small>ちょっと電気の知識が<br>あると解ける</small><span class="dots"><i class="on"></i><i class="on"></i><i></i><i></i></span></button>
    <button class="btn hard" data-lv="hard"><span class="no">LEVEL 03</span><b>むずかしい</b><small>モーター・電池・通信など<br>技術の話も</small><span class="dots"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></span></button>
    <button class="btn expert" data-lv="expert"><span class="no">LEVEL 04 ・ EXPERT</span><b>エキスパート</b><small>制限12秒。制御・半導体・<br>規格まで、専門家向け</small><span class="dots"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span></button>
  </div>
  <div id="unlock" class="glass">音声を有効にするには、画面を一度クリック（またはキーを押す）してください</div>
  <div class="tip">音声が出ないときは、画面を一度クリック（またはキーを押す）してください ・ ベストスコアはこの端末に保存されます</div>
</section>

<div id="qpanel" class="glass">
  <div class="row"><span class="eyebrow" id="qNo"></span><span id="segs"></span></div>
  <div class="q" id="qText"></div>
</div>
<div id="guide">
  <div class="glass"><em>○</em>両手を頭の上でくっつける</div>
  <div class="glass"><em>×</em>両腕を胸の前でクロスする</div>
</div>
<div id="ring"><svg viewBox="0 0 200 200" width="180" height="180">
  <circle cx="100" cy="100" r="88" fill="rgba(255,255,255,.85)" stroke="rgba(20,40,70,.15)" stroke-width="6"/>
  <circle id="ringArc" cx="100" cy="100" r="88" fill="none" stroke="#1e8fe0" stroke-width="6" stroke-linecap="round"
    transform="rotate(-90 100 100)" stroke-dasharray="552.9" stroke-dashoffset="552.9"/></svg>
  <div class="m" id="ringMark"></div></div>

<div id="reveal">
  <div id="rvCard" class="glass">
    <div id="rvMark"></div>
    <div id="rvMsg"></div>
    <div id="rvAns"></div>
    <div id="rvExp"></div>
    <div id="rvNextWrap"><button class="btn plain" id="btnNext"><b>次へ　<span style="color:var(--sub);font-weight:400;font-size:.8em">手をかざす</span></b></button></div>
  </div>
</div>

<section class="screen" id="sResult">
  <div class="eyebrow" id="rsLevel"></div>
  <div id="score"></div>
  <div class="rank" id="rsRank"></div>
  <p class="lead" id="rsBest" style="margin-bottom:34px"></p>
  <div class="btns">
    <button class="btn plain" data-act="retry"><b>もう一度</b></button>
    <button class="btn plain" data-act="levels"><b>レベル選択へ</b></button>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>
<script src="questions.js"></script>
<script src="speech.js"></script>
<script>
"use strict";
/* ============ 設定 ============ */
const HOLD_MS   = 1200;   // 同じポーズを保持して確定するまで
const Q_SEC     = 20;     // 1問の制限時間
const REVEAL_MS = 6000;   // 正解表示の自動送り
const DWELL_MS  = 1000;   // ボタンに手をかざす時間
const LEVELS = { easy:"やさしい", normal:"ふつう", hard:"むずかしい", expert:"エキスパート" };
const Q_SECS = { easy:20, normal:20, hard:18, expert:12 };   // レベル別の制限時間
let hist=[], qHold=false, qHoldAt=0, qSeen=false;

/* ============ ポーズ判定（テスト可能な純関数） ============
   lm: MediaPipe Pose の 33 点（x,y は 0-1 の正規化座標）, asp: 映像の 幅/高さ
   返り値: 'O' | 'X' | null                                          */
function classify(lm, asp){
  if(!lm) return null;
  const P = i => ({x: lm[i].x*asp, y: lm[i].y, v: lm[i].visibility ?? 1});
  const n=P(0), ls=P(11), rs=P(12), lw=P(15), rw=P(16);
  if([n,ls,rs,lw,rw].some(p => p.v < 0.4)) return null;
  const sw = Math.abs(ls.x-rs.x);               // 肩幅（スケール基準）
  if(sw < 0.04) return null;
  const wd = Math.abs(lw.x-rw.x);               // 手首どうしの距離
  // ○ : 両手首が鼻より上で、くっついている（頭上で輪をつくる）
  const shy=(ls.y+rs.y)/2;
  if(lw.y < n.y && rw.y < n.y && lw.y < shy-0.5*sw && rw.y < shy-0.5*sw && wd < 0.6*sw) return 'O';
  // × : 腕が交差（左右の手首の順序が肩と逆）して胸の前にある
  const sh = (ls.y+rs.y)/2, xmin=Math.min(ls.x,rs.x), xmax=Math.max(ls.x,rs.x);
  const crossed = (lw.x-rw.x)*(ls.x-rs.x) < 0 && wd > 0.5*sw;
  const inChest = [lw,rw].every(w => w.y > sh-0.2*sw && w.y < sh+1.0*sw && w.x > xmin-0.6*sw && w.x < xmax+0.6*sw);
  if(crossed && inChest) return 'X';
  return null;
}

/* ============ 状態 ============ */
const $ = id => document.getElementById(id);
const cv=$('view'), ctx=cv.getContext('2d'), video=$('cam');
let state='level', level=null, qs=[], idx=0, score=0;
let lm=null, vw=1280, vh=720, ready=false;
let armed=false, neutralSince=0, holdLabel=null, holdStart=0, qStart=0, revealAt=0, lastAnswer=null;
let dwell=new Map(), cursors=[], screenAt=0, lostAt=0, running=false;

function resize(){ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; }
addEventListener('resize', resize); resize();

/* ============ 音 ============ */
let actx=null;
function beep(f,d=.15,t='sine',v=.15){ try{
  actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume();
  const o=actx.createOscillator(),g=actx.createGain(); o.type=t;o.frequency.value=f;g.gain.value=v;
  o.connect(g);g.connect(actx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.stop(actx.currentTime+d);
}catch(e){} }
const sndOK=()=>{beep(660,.12);setTimeout(()=>beep(990,.25),110)};
const sndNG=()=>{beep(220,.35,'sawtooth',.12)};
const sndSel=()=>beep(520,.1);

/* ============ 読み上げ（ブラウザ内蔵の音声合成） ============ */
const TTS_OK = 'speechSynthesis' in window;
let ttsOn = true, jaVoice = null;
try{ ttsOn = localStorage.getItem('evquiz_tts') !== '0'; }catch(e){}

let jaVoices = [];
const PACKS = [['nanami','AI音声 女性（Nanami）'],['keita','AI音声 男性（Keita）'],['browser','ブラウザ内蔵の音声']];
let pack = 'nanami'; try{ pack = localStorage.getItem('evquiz_pack') || 'nanami'; }catch(e){}
if(!PACKS.some(q=>q[0]===pack)) pack='nanami';
function voiceScore(v){            // ブラウザ内蔵音声の場合: 自然な声 → Google → 標準の順
  let n=0;
  if(/Natural/i.test(v.name)) n+=100;
  if(/Online/i.test(v.name)) n+=40;
  if(/Nanami|Keita|Mayu|Naoki|Shiori|Daichi/i.test(v.name)) n+=20;
  if(/Google/i.test(v.name)) n+=30;
  if(/Haruka|Ayumi|Sayaka|Ichiro/i.test(v.name)) n+=5;
  if(/Premium|Enhanced|プレミアム|拡張/i.test(v.name)) n+=60;   // Mac: 高品質版の声（システム設定で追加したもの）
  if(/Kyoko|Otoya|Hattori|O-?Ren/i.test(v.name)) n+=5;           // Mac の標準の日本語音声
  if(/Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley/i.test(v.name)) n-=50;   // Mac のおもしろ声は避ける
  return n;
}
function pickVoice(){
  if(!TTS_OK) return;
  jaVoices = speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));
  jaVoice = jaVoices[0] || null;
}
if(TTS_OK){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function toast(m){
  const st=$('status'); st.textContent=m; st.style.display='block';
  clearTimeout(toast.t); toast.t=setTimeout(()=>{ if(st.textContent===m) st.style.display='none'; },2600);
}
function nextVoice(){                // V キーで声（音声パック）を切り替える
  const i=PACKS.findIndex(q=>q[0]===pack), q=PACKS[(i+1)%PACKS.length]; pack=q[0];
  try{ localStorage.setItem('evquiz_pack', pack); }catch(e){}
  toast('声: '+q[1]);
  say('こんにちは。この声で読み上げます。');
}

/* 読み上げ: 事前に作った音声ファイル（audio/<声>/<id>.mp3）を文ごとに再生。
   ファイルが無い文だけ、ブラウザ内蔵の音声で代わりに読む。 */
let playQ=[], playing=false, curAudio=null, token=0;
/* Safari は再生の許可が audio 要素ごとなので、1つを使い回し、最初のクリック・キー操作で無音を鳴らして許可を取っておく */
const player=new Audio(); let audioUnlocked=false;
function unlockAudio(){
  if(audioUnlocked || playing || !player.paused) return;   // 読み上げ中は許可が取れている
  audioUnlocked=true;
  player.onended=player.onerror=null;
  player.src='data:audio/wav;base64,UklGRnQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YVAAAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==';
  player.play().catch(err=>{ if(err && err.name==='NotAllowedError') audioUnlocked=false; });
}
addEventListener('pointerdown', unlockAudio, true);
addEventListener('keydown', unlockAudio, true);
function stopSpeech(){
  token++; playQ=[]; playing=false;
  if(curAudio){ curAudio.onended=curAudio.onerror=null; curAudio.pause(); curAudio=null; }
  if(TTS_OK) speechSynthesis.cancel();
}
function browserSpeak(s, done){
  if(!TTS_OK) return done();
  const u=new SpeechSynthesisUtterance(s); u.lang='ja-JP'; u.rate=1.0; u.pitch=1.0; if(jaVoice) u.voice=jaVoice;
  u.onend=done; u.onerror=done; speechSynthesis.speak(u);
}
function pump(tk){
  if(tk!==token) return;
  const s=playQ.shift();
  if(s===undefined){ playing=false; return; }
  const next=()=>{ if(tk===token) setTimeout(()=>pump(tk), 140); };
  if(pack==='browser'){ browserSpeak(s,next); return; }
  let fin=false;                                 // この1文について、次へ進むのは1回だけ
  const fb=()=>{ if(fin||tk!==token) return; fin=true; browserSpeak(s,next); };
  const a=player; curAudio=a;
  a.onended=()=>{ if(fin) return; fin=true; next(); };
  a.onerror=fb;                                  // ファイルが無い → 内蔵音声で代用
  a.src=`audio/${pack}/${clipId(s)}.mp3`;
  a.play().catch(err=>{
    if(tk!==token) return;                       // 中断済み（ESC・次の問題など）の古い失敗は無視
    if(err && err.name==='AbortError') return;
    if(err && err.name==='NotAllowedError'){ fin=true; toast('音声を出すには、画面を一度クリックするかキーを押してください'); playQ=[]; playing=false; }
    else fb();
  });
}
function say(text){
  if(!ttsOn) return;
  stopSpeech();
  playQ=toSentences(text); playing=true; pump(token);
}
function speaking(){ return ttsOn && (playing || (TTS_OK && speechSynthesis.speaking)); }
function renderTts(){ const b=$('ttsBtn'); b.textContent = ttsOn?'読み上げ ON':'読み上げ OFF'; b.classList.toggle('off',!ttsOn); }
function toggleTts(){
  ttsOn=!ttsOn; try{ localStorage.setItem('evquiz_tts', ttsOn?'1':'0'); }catch(e){}
  if(ttsOn) say('読み上げをオンにしました。'); else stopSpeech();
  renderTts();
}
$('ttsBtn').addEventListener('click', e=>{ e.stopPropagation(); e.currentTarget.blur(); toggleTts(); });
renderTts();

/* ============ 画面切替 ============ */
function show(which){
  if(which==='sLevel' && typeof stopSpeech==='function') stopSpeech();
  if(which==='sLevel') delete document.body.dataset.lv;
  dwell.clear(); screenAt=performance.now();
  ['sLevel','sResult'].forEach(id=>$(id).classList.toggle('on', id===which));
  const q = which==='question';
  $('qpanel').style.display = q?'block':'none';
  $('guide').style.display  = q?'flex':'none';
  $('timer').style.display  = q?'block':'none';
  $('hudLv').style.display  = (which==='sLevel')?'none':'inline-block';
  $('hudR').style.visibility = (which==='sLevel')?'hidden':'visible';
  $('reveal').classList.remove('on');
  $('ring').style.display='none';
}
function startGame(lv){
  level=lv; score=0; idx=0; hist=[]; document.body.dataset.lv=lv;
  qs=shuffle(QUIZ[lv].slice()).slice(0,10);
  $('hudLv').textContent=LEVELS[lv].toUpperCase();
  sndSel(); nextQuestion(true);
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }
function nextQuestion(first){
  dwell.clear(); screenAt=performance.now();
  if(!first) idx++;
  if(idx>=qs.length) return finish();
  state='question'; show('question');
  $('qNo').textContent=`Question ${idx+1} / ${qs.length}`;
  $('segs').innerHTML=qs.map((_,k)=>`<i class="${k<hist.length?(hist[k]?'ok':'ng'):k===idx?'cur':''}"></i>`).join('');
  say(`第${idx+1}問。`+qs[idx].q);
  qHold=true; qHoldAt=performance.now(); qSeen=false;
  $('qText').textContent=qs[idx].q;
  qStart=performance.now(); armed=false; neutralSince=0; holdLabel=null; lastAnswer=null;
  updateHud();
}
function updateHud(){ $('hudR').innerHTML = state==='level'?'':`SCORE<b>${score}</b>`; }

function answer(a){
  if(state!=='question') return;
  const q=qs[idx], ok = a===q.a;
  if(ok) score++; hist.push(ok); ok?sndOK():sndNG();
  state='reveal'; revealAt=performance.now(); dwell.clear(); screenAt=revealAt;
  const rv=$('reveal'); rv.className='on '+(ok?'ok':'ng');
  $('rvMark').textContent = ok?'○':'×';
  $('rvMsg').textContent = ok?'正解！':(a===null?'時間切れ…':'ざんねん…');
  $('rvAns').textContent = `答えは ${q.a==='O'?'○':'×'}`+(a?`　（あなたの答え: ${a==='O'?'○':'×'}）`:'');
  { const box=$('rvExp'); box.textContent='';      // 解説は1文ずつ段落にする（最初の1文が「なぜその答えか」）
    (q.e.match(/[^。]*。?/g)||[]).filter(t=>t.trim()).forEach((t,i)=>{ const p=document.createElement('p'); p.textContent=t; if(i===0) p.className='lead'; box.appendChild(p); }); }
  $('ring').style.display='none'; $('timer').style.display='none';
  updateHud();
  say((ok?'正解です。':(a===null?'時間切れです。':'ざんねん。'))+`答えは${q.a==='O'?'まる':'ばつ'}です。`+q.e);
}
function finish(){
  state='result'; show('sResult');
  const best = saveBest(level, score);
  $('rsLevel').textContent=`RESULT ・ ${LEVELS[level]}`;
  $('score').innerHTML=`${score}<small>/ ${qs.length}</small>`;
  $('rsRank').textContent = level==='expert'&&score>=9 ? 'EVエンジニア級！' : score>=9?'EVマスター！':score>=7?'EV通！':score>=4?'EV見習い':'ここから伸びしろ！';
  say(`結果は${qs.length}問中${score}問正解。`+$('rsRank').textContent);
  $('rsBest').textContent=`このレベルのベスト: ${best} 点`;
  $('hudR').textContent='';
}
function saveBest(lv,s){ let b=s; try{
  const k='evquiz_best_'+lv; b=Math.max(s, +localStorage.getItem(k)||0); localStorage.setItem(k,b);
}catch(e){} return b; }

/* ============ ボタン（手をかざして選択） ============ */
function activeButtons(){
  if(state==='level')  return [...document.querySelectorAll('#sLevel .btn')];
  if(state==='result') return [...document.querySelectorAll('#sResult .btn')];
  if(state==='reveal') return [$('btnNext')];
  return [];
}
function onButton(b){
  sndSel();
  if(b.dataset.lv) startGame(b.dataset.lv);
  else if(b.dataset.act==='retry') startGame(level);
  else if(b.dataset.act==='levels'){ state='level'; show('sLevel'); updateHud(); }
  else if(b.id==='btnNext') nextQuestion();
}
document.addEventListener('click', e=>{ const b=e.target.closest('.btn'); if(b && b.offsetParent!==null) onButton(b); });

function updateDwell(now){
  const btns=activeButtons();
  if(now-screenAt<1800){ document.querySelectorAll('.btn').forEach(b=>b.style.setProperty('--p',0)); return; }
  document.querySelectorAll('.btn').forEach(b=>b.style.setProperty('--p',0));
  for(const b of btns){
    const r=b.getBoundingClientRect(), pad=12;
    const hit = cursors.some(c=>c.x>r.left-pad&&c.x<r.right+pad&&c.y>r.top-pad&&c.y<r.bottom+pad);
    if(hit){
      if(!dwell.has(b)) dwell.set(b,now);
      const f=Math.min(1,(now-dwell.get(b))/DWELL_MS); b.style.setProperty('--p',f);
      if(f>=1){ dwell.clear(); onButton(b); return; }
    } else dwell.delete(b);
  }
}

/* ============ 毎フレーム処理 ============ */
function update(now){
  { const act = navigator.userActivation ? navigator.userActivation.hasBeenActive : true;
    $('unlock').style.display = (state==='level' && !act && ttsOn) ? 'inline-block' : 'none'; }
  // 手のカーソル位置（画面座標・左右反転済み）
  const t=coverT(); cursors=[];
  if(lm) for(const i of [15,16]){ const p=lm[i]; if((p.visibility??1)>.4) cursors.push(toScreen(p,t)); }

  if(state==='level'||state==='result'||state==='reveal') updateDwell(now);
  if(state==='reveal' && now-revealAt>REVEAL_MS && (!speaking() || now-revealAt>60000)) nextQuestion();

  if(state==='question'){
    if(qHold){            // 問題の読み上げ中はタイマーを止める（最長12秒）
      if(speaking()){ qSeen=true; qStart=now; }
      else if(qSeen || now-qHoldAt>800){ qHold=false; qStart=now; }
      if(now-qHoldAt>12000) qHold=false;
    }
    const qsec=Q_SECS[level]||Q_SEC, left=Math.max(0,qsec-(now-qStart)/1000);
    const bar=$('timer').firstElementChild; bar.style.width=(left/qsec*100)+'%';
    bar.style.background = left<4?'var(--ng)':'var(--lv)';
    if(left<=0) return answer(null);
    const cur=classify(lm, vw/vh);
    if(!armed){                       // 前の問題の姿勢が残らないよう、一度腕を下ろすまで待つ
      if(cur===null){ if(!neutralSince) neutralSince=now; if(now-neutralSince>500) armed=true; }
      else neutralSince=0;
    } else if(cur && cur===holdLabel){
      lostAt=now; const f=Math.min(1,(now-holdStart)/HOLD_MS); drawRing(cur,f);
      if(f>=1) return answer(cur);
    } else if(holdLabel && now-lostAt<150){ /* 一瞬の揺れは猶予 */ }
    else { holdLabel=cur; holdStart=now; drawRing(null,0); }
  }
}
function drawRing(label,f){
  const r=$('ring'); r.style.display=label?'block':'none';
  if(!label) return;
  $('ringArc').style.strokeDashoffset = 540.4*(1-f);
  $('ringMark').textContent = label==='O'?'○':'×';
  $('ringMark').style.color = label==='O'?'var(--ok)':'var(--ng)';
}

/* ============ 描画 ============ */
function coverT(){ const W=cv.width,H=cv.height,s=Math.max(W/vw,H/vh); return {W,H,s,dx:(W-vw*s)/2,dy:(H-vh*s)/2}; }
function toScreen(p,t){ // CSS ピクセル（左右反転）
  const k=1/devicePixelRatio;
  return { x:(t.W-(p.x*vw*t.s+t.dx))*k, y:(p.y*vh*t.s+t.dy)*k };
}
const BONES=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24]];
function render(){
  const t=coverT(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,t.W,t.H);
  if(video.readyState>=2){
    ctx.save(); ctx.translate(t.W,0); ctx.scale(-1,1);
    ctx.drawImage(video,t.dx,t.dy,vw*t.s,vh*t.s); ctx.restore();
  }
  if(lm){
    const k=devicePixelRatio, pt=i=>{const q=toScreen(lm[i],t);return [q.x*k,q.y*k]};
    ctx.lineWidth=7*k/2; ctx.lineCap='round'; ctx.strokeStyle='rgba(30,143,224,.9)';
    for(const [a,b] of BONES){ if((lm[a].visibility??1)<.4||(lm[b].visibility??1)<.4) continue;
      ctx.beginPath(); ctx.moveTo(...pt(a)); ctx.lineTo(...pt(b)); ctx.stroke(); }
    ctx.fillStyle='#fff'; ctx.strokeStyle='rgba(30,143,224,.9)'; for(const i of [0,11,12,13,14]){ if((lm[i].visibility??1)<.4) continue; ctx.beginPath(); ctx.arc(...pt(i),6*k,0,7); ctx.fill(); }
    ctx.fillStyle='#ff9f1a'; for(const i of [15,16]){ if((lm[i].visibility??1)<.4) continue; ctx.beginPath(); ctx.arc(...pt(i),14*k,0,7); ctx.fill(); }
  }
}

/* ============ MediaPipe 起動 ============ */
function onResults(res){
  lm = res.poseLandmarks||null;
  vw=video.videoWidth||vw; vh=video.videoHeight||vh;
  if(!ready){ ready=true; $('status').style.display='none'; }
  else $('status').style.display = (!lm && state==='question')?'block':'none';
  if(!lm && state==='question'){ $('status').textContent='体が映っていません。カメラの前に立ってください（上半身が全部映る位置）'; }
  render(); update(performance.now());
}
async function boot(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'},audio:false});
    video.srcObject=stream; await video.play(); vw=video.videoWidth; vh=video.videoHeight;
  }catch(e){ $('status').textContent='カメラが使えません（'+e.name+'）。キー操作（1-4, O, X）でも遊べます。'; startFallbackLoop(); return; }
  if(typeof Pose==='undefined'){ $('status').textContent='AIモデルを読み込めません（インターネット接続を確認）。キー操作でも遊べます。'; startFallbackLoop(); return; }
  const pose=new Pose({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/${f}`});
  pose.setOptions({modelComplexity:1,smoothLandmarks:true,minDetectionConfidence:.5,minTrackingConfidence:.5});
  pose.onResults(onResults);
  (async function loop(){
    if(video.readyState>=2){ try{ await pose.send({image:video}); }catch(e){ $('status').textContent='AIモデルを読み込めません（インターネット接続を確認）。キー操作でも遊べます。'; $('status').style.display='block'; if(!running){running=true; startFallbackLoop();} return; } }
    requestAnimationFrame(loop);
  })();
}
function startFallbackLoop(){ running=true; $('status').style.display='block';
  (function l(){ render(); update(performance.now()); requestAnimationFrame(l); })(); }

/* ============ キー操作（予備・デモ用） ============ */
addEventListener('keydown', e=>{
  if(e.repeat) return;
  const k=e.key.toLowerCase();
  if(k===' '||k==='enter') e.preventDefault();
  if(k==='escape'){            // ESC: 途中でやめてレベル選択へ
    if(state!=='level'){ stopSpeech(); qHold=false; state='level'; show('sLevel'); updateHud(); toast('中断しました'); }
    return;
  }
  if(k==='v'){ nextVoice(); return; }
  if(state==='level' && ['1','2','3','4'].includes(k)) startGame(['easy','normal','hard','expert'][+k-1]);
  else if(k==='m') toggleTts();
  else if(state==='question' && (k==='o'||k==='x')) answer(k.toUpperCase());
  else if(state==='reveal' && (k===' '||k==='enter')) nextQuestion();
  else if(state==='result' && k==='r') startGame(level);
  else if(state==='result' && (k===' '||k==='enter')) { state='level'; show('sLevel'); }
});
window.__classify=classify;
boot();
</script>
</body>
